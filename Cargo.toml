[package]
name = "qcraft"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "qcraft"
path = "src/main.rs"

[dependencies]
# CLI & Interactive UI
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] } # รองรับการพิมพ์ค้นหาใน Dropdown!
comfy-table = "7.1"                                          # วาดตารางพรีวิวข้อมูลสวยๆ ใน Terminal
arboard = "3.4"                                              # คัดลอกโค้ดลง Clipboard อัตโนมัติ

# Async Runtime & SQL Server Driver
tokio = { version = "1.36", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12", default-features = false, features = ["sql-browser-tokio", "rustls", "tds73", "winauth"] }

# Serialization & Config (TOML สำหรับ Config, JSON สำหรับ Query Presets)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Formatting & Error Handling
indoc = "2.0"
anyhow = "1.0"
thiserror = "1.0"